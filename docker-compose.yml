# docker compose up --build        -> http://localhost:8080
# docker compose run --rm ingest   -> (re)ingest ./corpus
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inccorp
      POSTGRES_PASSWORD: inccorp
      POSTGRES_DB: inccorp
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inccorp"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://inccorp:inccorp@db:5432/inccorp
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  ingest:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://inccorp:inccorp@db:5432/inccorp
    volumes: [./corpus:/corpus:ro]
    command: ["python", "ingest.py", "/corpus"]
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
