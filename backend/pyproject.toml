[project]
name = "inccorpai"
version = "1.0.0"
description = "Production-grade RAG engine for multi-jurisdictional startup incorporation and regulatory compliance."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "anthropic>=0.40",
    "openai>=1.40",
    "cohere>=5.5",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Local cross-encoder reranker (BAAI/bge-reranker-large). Heavy: pulls torch.
local-rerank = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["B008", "E501", "E741", "RUF001", "RUF002", "RUF003"]  # FastAPI Depends/File defaults; legal text uses en/em dashes
